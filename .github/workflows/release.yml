name: Release

# Auto-publishes via Changesets + npm Trusted Publishing. On a push to main:
#   - If there are unconsumed changesets, opens/updates the "Version Packages" PR.
#   - If a "Version Packages" PR was just merged (no changesets remain),
#     publishes the bumped versions to npm with provenance via OIDC.
# The `npm-publish` environment gates the publish step on required-reviewer
# approval and is the environment claim Trusted Publishing matches against.
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release via Changesets
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # NOTE: `registry-url` is intentionally omitted. Setting it makes
          # setup-node write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}`,
          # which the npm CLI then prefers over the OIDC token even when the
          # auth-token is empty — breaking Trusted Publishing (404 on PUT).
          # Without the file, npm detects the OIDC env vars
          # (ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN) and mints a publish credential
          # automatically against the per-package Trusted Publisher config.

      # Trusted Publishing (auto-minting a publish credential from the
      # OIDC token against the per-package Trusted Publisher config)
      # requires npm >= 11.5.1. Node 20.x ships with npm 10.x, so the
      # workflow has to upgrade explicitly. Without this, provenance still
      # signs successfully but the publish PUT goes unauthenticated and
      # npm returns 404 (or ENEEDAUTH if no .npmrc is present).
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          # `pnpm version` (no `run`) is reserved by pnpm as the
          # npm-compatible "show versions" command — it ignores the
          # script in package.json and exits without bumping anything.
          # `pnpm run <script>` forces the package-script behavior.
          publish: pnpm run release
          version: pnpm run version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
