name: Release

# DISABLED until release infrastructure is in place. Re-enable by restoring
# the `push` trigger below once these are configured:
#   1. Repo settings → Actions → General → Workflow permissions:
#      enable "Read and write" + "Allow GitHub Actions to create and
#      approve pull requests" (required so changesets/action can open the
#      "Version Packages" PR).
#   2. npm Trusted Publisher set up on npmjs.com for @agentronics/protocol,
#      @agentronics/sdk, @agentronics/react. See
#      `apps/mds/sdk-coding-plan.md` §9 items 9–10 and
#      `apps/mds/sdk-deploy-runbook.md` §4.
#   3. GitHub environment `npm-publish` created in repo settings →
#      Environments, with required reviewers (your handle).
#
# Until then, the workflow can still be triggered manually from the
# Actions tab via "Run workflow" (workflow_dispatch).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release via Changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
