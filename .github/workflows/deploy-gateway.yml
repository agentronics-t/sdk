name: Deploy gateway

# DISABLED until Vercel infrastructure is in place. Re-enable by restoring
# the `push` trigger below once these are configured:
#   1. Vercel project for the gateway exists at gateway.agentronics.dev.
#      See `apps/mds/sdk-deploy-runbook.md` §1.
#   2. Repo secrets added in repo settings → Secrets and variables → Actions:
#      VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_GATEWAY_PROJECT_ID.
#   3. GitHub environment `production` created in repo settings →
#      Environments (referenced by `environment: production` below).
#
# Until then, the workflow can still be triggered manually from the
# Actions tab via "Run workflow" (workflow_dispatch).
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'packages/gateway/**'
  #     - 'packages/protocol/**'
  #     - 'pnpm-lock.yaml'
  #     - '.github/workflows/deploy-gateway.yml'

concurrency:
  group: deploy-gateway
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build gateway
        run: pnpm --filter @agentronics/gateway... build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_GATEWAY_PROJECT_ID: ${{ secrets.VERCEL_GATEWAY_PROJECT_ID }}
        working-directory: packages/gateway
        run: |
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
